[project]
name = "kreb"
version = "0.0.1"
description = "Codebase comprehension: a symbol-anchored, confidence-tagged research document, and renderers for it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.9",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.14.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
kreb = "kreb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kreb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
