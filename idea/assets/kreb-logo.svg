<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kreb: a one-eyed crab holding a club, painted in ochre and charcoal">
  <title>kreb</title>

  <defs>
    <filter id="daub" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#daub)" stroke="#241C15" stroke-linecap="round" stroke-linejoin="round">

    <!-- club shaft, drawn under the claw so the claw reads as gripping it -->
    <path d="M150 98 L190 32" stroke="#8E3419" stroke-width="12" fill="none"/>

    <!-- legs: thick and splayed, they carry the silhouette -->
    <g stroke-width="9" fill="none">
      <path d="M62 132 L38 150"/>
      <path d="M78 137 L62 163"/>
      <path d="M92 139 L88 171"/>
      <path d="M138 132 L162 150"/>
      <path d="M122 137 L138 163"/>
      <path d="M108 139 L112 171"/>
    </g>

    <!-- arms -->
    <g stroke-width="10" fill="none">
      <path d="M52 96 L34 73"/>
      <path d="M148 96 L166 73"/>
    </g>

    <!-- claws: the feature that says crab. Two jaws each, held open. -->
    <g fill="#C4622B" stroke-width="5">
      <ellipse cx="28" cy="63" rx="20" ry="13" transform="rotate(-32 28 63)"/>
      <ellipse cx="23" cy="41" rx="15" ry="8"  transform="rotate(-40 23 41)"/>
      <ellipse cx="172" cy="63" rx="20" ry="13" transform="rotate(32 172 63)"/>
      <ellipse cx="177" cy="41" rx="15" ry="8"  transform="rotate(40 177 41)"/>
    </g>

    <!-- club head, above the gripping claw -->
    <path d="M191 28 c9 -4 16 3 13 12 c-3 8 -12 10 -18 4 c-5 -5 -2 -13 5 -16 z"
          fill="#8E3419" stroke-width="5"/>

    <!-- carapace: wide and flat -->
    <path d="M42 106 C41 86 62 76 100 75 C138 76 159 87 158 107
             C157 124 133 136 100 136 C67 136 43 123 42 106 Z"
          fill="#C4622B" stroke-width="6"/>
    <path d="M56 124 C72 133 87 136 100 136 C119 136 138 130 148 119"
          stroke="#8E3419" stroke-width="7" fill="none"/>

    <!-- one eye, small enough that the crab lands first -->
    <circle cx="100" cy="101" r="11" fill="#E4D5B7" stroke-width="5"/>
    <circle cx="101" cy="102" r="4.5" fill="#241C15" stroke="none"/>
  </g>
</svg>
